name: Compile and commit hybrid condition engine

on:
  push:
    branches: [agent/hybrid-condition-target-engine]

permissions:
  contents: write

jobs:
  compile-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hybrid-condition-target-engine
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install native compilation dependencies
        shell: Rscript {0}
        run: install.packages(c("Rcpp", "RcppEigen", "Matrix"))
      - name: Apply canonical source patch
        run: |
          base64 --decode .agent-patch/apply_hybrid_target_engine.py.gz.b64 | gzip -d > /tmp/apply_hybrid_target_engine.py
          python /tmp/apply_hybrid_target_engine.py
          rm -f .agent-patch/trigger
      - name: Compile canonical target engine
        shell: bash
        run: |
          set -o pipefail
          export PKG_CPPFLAGS="$(Rscript -e 'cat(Rcpp:::CxxFlags())') $(Rscript -e 'cat(RcppEigen:::CxxFlags())') -I${GITHUB_WORKSPACE}/src"
          export PKG_CXXFLAGS="-std=gnu++17"
          R CMD SHLIB src/condition_target_engine.cpp 2>&1 | tee /tmp/hybrid-kernel-compile.log
      - name: Verify sufficient-statistic identities
        shell: Rscript {0}
        run: |
          set.seed(20260801)
          for (iteration in seq_len(50L)) {
            n <- sample(20:60, 1L); p <- sample(2:12, 1L)
            X <- matrix(rnorm(n * p), n, p); y <- rnorm(n); beta <- rnorm(p)
            intercept <- mean(y - as.numeric(X %*% beta))
            residual <- y - intercept - as.numeric(X %*% beta)
            x_mean <- colMeans(X); y_mean <- mean(y)
            gram <- crossprod(X) - n * tcrossprod(x_mean)
            rhs <- as.numeric(crossprod(X, y)) - n * x_mean * y_mean
            response_ss <- sum((y - y_mean)^2)
            direct_objective <- 0.5 * mean(residual^2)
            gram_objective <- 0.5 / n * (drop(crossprod(beta, gram %*% beta)) - 2 * sum(rhs * beta) + response_ss)
            direct_gradient <- -as.numeric(crossprod(X, residual)) / n
            gram_gradient <- as.numeric(gram %*% beta - rhs) / n
            stopifnot(
              isTRUE(all.equal(direct_objective, gram_objective, tolerance = 1e-12)),
              isTRUE(all.equal(direct_gradient, gram_gradient, tolerance = 1e-11)),
              isTRUE(all.equal(intercept, y_mean - sum(x_mean * beta), tolerance = 1e-12))
            )
            a <- rnorm(1L)
            direct_sse <- sum((y - a - X %*% beta)^2)
            stat_sse <- sum(y^2) - 2 * a * sum(y) - 2 * sum(beta * as.numeric(crossprod(X, y))) + n * a^2 + 2 * a * sum(beta * colSums(X)) + drop(crossprod(beta, crossprod(X) %*% beta))
            stopifnot(isTRUE(all.equal(direct_sse, stat_sse, tolerance = 1e-11)))
          }
      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Version: 1.6.1$' DESCRIPTION
          grep -q '^Config/Pando/NativeSparseABI: 5$' DESCRIPTION
          grep -q 'validation_mse_from_stats' src/condition_target_engine.cpp
          test -f tests/testthat/helper-condition-target-engine.R
          test -f tests/testthat/test-condition-target-engine-hybrid.R
          test ! -e .agent-patch/apply_hybrid_target_engine.py.gz.b64
          test ! -e .agent-bundle/chunk00
      - name: Commit canonical implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Accelerate condition nested CV with hybrid Gram statistics"
          git push origin HEAD:agent/hybrid-condition-target-engine
