name: native-condition-runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install numerical test dependencies
        shell: Rscript {0}
        run: install.packages(c("Matrix", "Rcpp", "RcppEigen", "testthat"))
      - name: Run exact source-kernel product checks
        shell: Rscript {0}
        run: |
          library(Matrix)
          library(testthat)
          eigen_include <- system.file("include", package = "RcppEigen")
          stopifnot(nzchar(eigen_include))
          old_flags <- Sys.getenv("PKG_CPPFLAGS", unset = "")
          on.exit(Sys.setenv(PKG_CPPFLAGS = old_flags), add = TRUE)
          Sys.setenv(
            PKG_CPPFLAGS = paste(
              old_flags,
              paste0("-I", shQuote(eigen_include)),
              "-DEIGEN_DONT_PARALLELIZE"
            )
          )
          Rcpp::sourceCpp("src/condition_product.cpp")
          source("R/condition_grn_crossfit.R")
          source("R/condition_grn_fit.R")
          .condition_product_matrix_cpp <- condition_product_matrix_cpp
          .condition_model_name <- function(x) x
          test_file("tests/testthat/test-condition-product-fixed.R")
          test_file("tests/testthat/test-condition-product-random.R")
          test_file("tests/testthat/test-condition-product-output.R")

  installed-r45-matrix17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install Bioconductor system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libbz2-dev \
            libcurl4-openssl-dev \
            libdeflate-dev \
            liblzma-dev \
            libssl-dev \
            libxml2-dev \
            zlib1g-dev
      - name: Install a coherent Bioconductor runtime
        shell: Rscript {0}
        run: |
          install.packages("BiocManager")
          bioc_packages <- c(
            "BiocGenerics", "S4Vectors", "IRanges", "GenomeInfoDb",
            "XVector", "Biostrings", "Rsamtools", "GenomicAlignments",
            "rtracklayer", "GenomicFeatures", "biovizBase"
          )
          message("Using Bioconductor ", BiocManager::version())
          BiocManager::install(
            bioc_packages,
            ask = FALSE,
            update = TRUE,
            force = TRUE
          )
          stopifnot(vapply(
            bioc_packages,
            requireNamespace,
            logical(1),
            quietly = TRUE
          ))
      - name: Compile legacy C++11 dependencies with current Armadillo
        run: |
          printf '%s\n' 'CXX11STD = -std=gnu++14' > "$RUNNER_TEMP/Makevars"
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          R_MAKEVARS_USER: ${{ runner.temp }}/Makevars
        with:
          extra-packages: |
            any::testthat
            any::remotes
          dependencies: '"hard"'
      - name: Pin Matrix 1.7-4
        shell: Rscript {0}
        run: |
          remotes::install_version(
            "Matrix", version = "1.7-4",
            repos = "https://cloud.r-project.org",
            upgrade = "never"
          )
          stopifnot(as.character(packageVersion("Matrix")) == "1.7.4")
      - name: Install Pando and load registered DLL
        run: R CMD INSTALL . --no-multiarch --with-keep.source
      - name: Verify installed namespace and strict native condition ABI
        shell: Rscript {0}
        run: |
          library(Pando)
          library(testthat)
          stopifnot(as.character(packageVersion("Pando")) == "1.6.3")
          stopifnot(as.character(packageVersion("Matrix")) == "1.7.4")
          description <- utils::packageDescription("Pando")
          stopifnot(
            identical(description[["Config/Pando/NativeSparseABI"]], "6"),
            identical(
              description[["Config/Pando/ConditionTargetEngineBackend"]],
              "cpp-eigen-memory-bounded-hybrid-target-v1"
            ),
            identical(
              description[["Config/Pando/ConditionInnerCVBackend"]],
              "exact-refit-validation-sparse-residual-v1"
            ),
            identical(
              description[["Config/Pando/ConditionRefitBackend"]],
              "dense-direct-or-matrix-free-schur-pcg-v1"
            ),
            identical(
              description[["Config/Pando/ConditionMemoryContract"]],
              "no-full-p2-on-high-p-path-v1"
            )
          )
          stopifnot(is.loaded(
            "_Pando_condition_product_matrix_cpp", PACKAGE = "Pando"
          ))
          stopifnot(is.loaded(
            "_Pando_condition_fit_multitask_path_cpp", PACKAGE = "Pando"
          ))
          stopifnot(is.loaded(
            "_Pando_condition_refit_path_cpp", PACKAGE = "Pando"
          ))
          stopifnot(is.loaded(
            "_Pando_condition_fit_target_engine_cpp", PACKAGE = "Pando"
          ))
          stopifnot(is.loaded(
            "_Pando_condition_native_self_test_cpp", PACKAGE = "Pando"
          ))
          test_file(
            "tests/testthat/test-condition-sparse-runtime-regression.R"
          )
          test_file(
            "tests/testthat/test-condition-refit-native.R"
          )
          test_file(
            "tests/testthat/test-condition-target-engine.R"
          )
          test_file(
            "tests/testthat/test-condition-target-engine-hybrid.R"
          )
          test_file(
            "tests/testthat/test-condition-high-p-allocation.R"
          )
          test_file(
            "tests/testthat/test-condition-matrix-free-refit.R"
          )
          test_file(
            "tests/testthat/test-condition-compact-diagnostics.R"
          )
          test_file(
            "tests/testthat/test-condition-target-checkpoint.R"
          )
          sessionInfo()
