name: native-condition-runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install numerical test dependencies
        shell: Rscript {0}
        run: install.packages(c("Matrix", "Rcpp", "RcppEigen", "testthat"))
      - name: Run exact source-kernel product checks
        shell: Rscript {0}
        run: |
          library(Matrix)
          library(testthat)
          eigen_include <- system.file("include", package = "RcppEigen")
          stopifnot(nzchar(eigen_include))
          old_flags <- Sys.getenv("PKG_CPPFLAGS", unset = "")
          on.exit(Sys.setenv(PKG_CPPFLAGS = old_flags), add = TRUE)
          Sys.setenv(
            PKG_CPPFLAGS = paste(
              old_flags,
              paste0("-I", shQuote(eigen_include)),
              "-DEIGEN_DONT_PARALLELIZE"
            )
          )
          Rcpp::sourceCpp("src/condition_product.cpp")
          source("R/condition_grn_crossfit.R")
          source("R/condition_grn_fit.R")
          .condition_product_matrix_cpp <- condition_product_matrix_cpp
          .condition_model_name <- function(x) x
          test_file("tests/testthat/test-condition-product-fixed.R")
          test_file("tests/testthat/test-condition-product-random.R")
          test_file("tests/testthat/test-condition-product-output.R")

  installed-r45-matrix17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::remotes
          dependencies: '"hard"'
      - name: Pin Matrix 1.7-4
        shell: Rscript {0}
        run: |
          remotes::install_version(
            "Matrix", version = "1.7-4",
            repos = "https://cloud.r-project.org",
            upgrade = "never"
          )
          stopifnot(as.character(packageVersion("Matrix")) == "1.7.4")
      - name: Install Pando and load registered DLL
        run: R CMD INSTALL . --no-multiarch --with-keep.source
      - name: Verify installed namespace and strict native sparse ABI
        shell: Rscript {0}
        run: |
          library(Pando)
          library(testthat)
          stopifnot(as.character(packageVersion("Pando")) == "1.5.1")
          stopifnot(as.character(packageVersion("Matrix")) == "1.7.4")
          stopifnot(is.loaded(
            "_Pando_condition_product_matrix_cpp", PACKAGE = "Pando"
          ))
          stopifnot(is.loaded(
            "_Pando_condition_fit_multitask_path_cpp", PACKAGE = "Pando"
          ))
          test_file(
            "tests/testthat/test-condition-sparse-runtime-regression.R"
          )
          sessionInfo()
