name: native-product-equivalence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Remove remote-only dependency metadata
        shell: python
        run: |
          from pathlib import Path
          lines = Path("DESCRIPTION").read_text().splitlines()
          output = []
          skipping = False
          for line in lines:
              if line.startswith("Remotes:"):
                  skipping = True
                  continue
              if skipping and (line.startswith(" ") or line.startswith("\t")):
                  continue
              skipping = False
              output.append(line)
          Path("DESCRIPTION").write_text("\n".join(output) + "\n")
      - name: Install package dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "testthat"))
          remotes::install_deps(
            dependencies = c("Depends", "Imports", "LinkingTo")
          )
      - name: Install Pando
        shell: Rscript {0}
        run: remotes::install_local(
          ".", dependencies = FALSE, upgrade = "never"
        )
      - name: Run exact product checks
        shell: Rscript {0}
        run: |
          library(testthat)
          library(Pando)
          test_file("tests/testthat/test-condition-product-fixed.R")
          test_file("tests/testthat/test-condition-product-random.R")
          test_file("tests/testthat/test-condition-product-output.R")
