name: native-condition-runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-cpp-only-source:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/fix-sparse-solver-step'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sparse-solver-step
          fetch-depth: 0
      - name: Rewrite canonical runtime and remove migration logic
        shell: python
        run: |
          from pathlib import Path
          import re

          Path("R/RcppExports.R").write_text("""# Generated by using Rcpp::compileAttributes(); do not edit by hand

.condition_fit_multitask_path_cpp <- function(X_list, y_list, lambda, alpha, condition_mix, condition_weight, coefficient_mask, max_iter, tol_objective, tol_coef, keep_history) {
    .Call(`_Pando_condition_fit_multitask_path_cpp`, X_list, y_list, lambda, alpha, condition_mix, condition_weight, coefficient_mask, max_iter, tol_objective, tol_coef, keep_history)
}

.condition_product_matrix_cpp <- function(left_matrix, right_matrix, left_index, right_index) {
    .Call(`_Pando_condition_product_matrix_cpp`, left_matrix, right_matrix, left_index, right_index)
}
""")

          solver = Path("R/condition_grn_solver.R")
          text = solver.read_text()
          pattern = re.compile(
              r"\.condition_fit_multitask_path_core <- function\(.*?\n\}\n\n(?=\.condition_fit_multitask_path <- function)",
              re.S,
          )
          replacement = """.condition_fit_multitask_path_core <- function(
    X_list,
    y_list,
    lambda,
    alpha,
    condition_mix,
    condition_weight,
    coefficient_mask,
    max_iter,
    tol_objective,
    tol_coef,
    keep_history,
    backend = getOption('Pando.condition_solver', 'auto')
) {
    backend <- match.arg(backend, c('auto', 'cpp', 'R'))
    if (identical(backend, 'R')) {
        stop(
            'The R condition solver backend is not available; ',
            'Pando requires the compiled C++ solver.',
            call. = FALSE
        )
    }
    if (!.condition_native_solver_available()) {
        stop(
            'The compiled condition-GRN solver is not loaded or registered.',
            call. = FALSE
        )
    }
    answer <- .condition_fit_multitask_path_cpp(
        X_list,
        y_list,
        lambda,
        alpha,
        condition_mix,
        condition_weight,
        coefficient_mask,
        as.integer(max_iter),
        tol_objective,
        tol_coef,
        keep_history
    )
    predictor_names <- colnames(X_list[[1L]])
    conditions <- names(X_list)
    answer$fits <- lapply(answer$fits, function(fit) {
        dimnames(fit$beta) <- list(predictor_names, conditions)
        names(fit$intercept) <- conditions
        fit$backend <- 'cpp_eigen_sparse_fista'
        fit
    })
    answer
}

"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Failed to replace canonical solver dispatch")
          solver.write_text(text)

          Path("tests/testthat/test-condition-sparse-runtime-regression.R").write_text("""test_that("installed sparse condition kernels use strict C++ execution", {
    expect_true(exists(
        ".condition_product_matrix_cpp",
        envir = asNamespace("Pando"),
        inherits = FALSE
    ))
    expect_false(exists(
        ".condition_product_matrix_r",
        envir = asNamespace("Pando"),
        inherits = FALSE
    ))
    expect_true(is.loaded(
        "_Pando_condition_product_matrix_cpp", PACKAGE = "Pando"
    ))
    expect_true(is.loaded(
        "_Pando_condition_fit_multitask_path_cpp", PACKAGE = "Pando"
    ))
    cells <- paste0("c", seq_len(20L))
    base <- seq_len(20L) - mean(seq_len(20L))
    X <- methods::as(Matrix::Matrix(
        cbind(x1 = base, x2 = 2 * base, x3 = -base),
        sparse = TRUE,
        dimnames = list(cells, c("x1", "x2", "x3"))
    ), "dgCMatrix")
    product <- Pando:::.condition_product_matrix_cpp(
        X, X, as.integer(1:3), as.integer(1:3)
    )
    expect_s4_class(product, "dgCMatrix")
    expect_identical(
        as.matrix(product),
        as.matrix(X[, 1:3, drop = FALSE] * X[, 1:3, drop = FALSE])
    )

    X_list <- list(A = X, B = X)
    y_list <- list(A = base, B = rev(base))
    mask <- matrix(
        TRUE, nrow = ncol(X), ncol = length(X_list),
        dimnames = list(colnames(X), names(X_list))
    )
    fit <- Pando:::.condition_fit_multitask_path_core(
        X_list = X_list,
        y_list = y_list,
        lambda = 1,
        alpha = 0.5,
        condition_mix = 0.5,
        condition_weight = "equal",
        coefficient_mask = mask,
        max_iter = 1L,
        tol_objective = 1e-7,
        tol_coef = 1e-6,
        keep_history = FALSE,
        backend = "cpp"
    )
    expect_identical(fit$fits[[1L]]$backend, "cpp_eigen_sparse_fista")
    expect_true(all(is.finite(fit$fits[[1L]]$beta)))
    expect_error(
        Pando:::.condition_fit_multitask_path_core(
            X_list, y_list, 1, 0.5, 0.5, "equal", mask,
            1L, 1e-7, 1e-6, FALSE, backend = "R"
        ),
        "requires the compiled C\\+\\+ solver"
    )
})

test_that("strict native product kernel rejects unsupported S4 layouts", {
    symmetric <- methods::as(Matrix::Diagonal(3), "dsCMatrix")
    expect_error(
        Pando:::.condition_product_matrix_cpp(
            symmetric, symmetric, as.integer(1:3), as.integer(1:3)
        ),
        "dgCMatrix"
    )
})
""")

          description = Path("DESCRIPTION")
          text = description.read_text()
          old = "uses a compiled Eigen proximal-gradient path solver with an R reference\n    fallback. The TF-by-ATAC product kernel also has an exact sparse R fallback,\n    selectable through the Pando.condition_product option."
          new = "uses only the compiled Eigen proximal-gradient path solver. The\n    TF-by-ATAC product kernel is also C++-only; missing registration, unsupported\n    sparse classes and native execution errors terminate the analysis."
          if old not in text:
              raise SystemExit("Expected fallback DESCRIPTION text was not found")
          text = text.replace(old, new)
          text = text.replace(
              "Config/Pando/ConditionProductBackend: auto-cpp-with-exact-sparse-r-fallback",
              "Config/Pando/ConditionProductBackend: cpp-only-fail-fast"
          )
          text = text.replace(
              "Config/Pando/ConditionSolverBackend: auto-cpp-with-r-reference-fallback",
              "Config/Pando/ConditionSolverBackend: cpp-only-fail-fast"
          )
          description.write_text(text)

          Path("NEWS.md").write_text("""# Pando 1.5.1

- Reads condition-model sparse inputs directly from canonical `dgCMatrix` slots instead of coercing S4 objects through `Rcpp::NumericMatrix` or `Rcpp::as<Eigen::MappedSparseMatrix<double>>`.
- Uses only the registered C++ TF-by-ATAC product kernel and C++ multitask solver. Missing symbols, unsupported sparse layouts, and native execution errors stop the analysis immediately.
- Initializes native FISTA from centered per-condition spectral-norm estimates rather than the summed Frobenius-norm upper bound.
- Adds installed-package CI for R 4.5.1, Matrix 1.7.4, native `.Call` registration, strict sparse type validation, the product kernel, and the multitask solver.
- Bumps the package version so installations from before and after the native ABI change are distinguishable.
""")

          Path(".github/workflows/native-product-equivalence.yaml").write_text("""name: native-condition-runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install numerical test dependencies
        shell: Rscript {0}
        run: install.packages(c("Matrix", "Rcpp", "RcppEigen", "testthat"))
      - name: Run exact source-kernel product checks
        shell: Rscript {0}
        run: |
          library(Matrix)
          library(testthat)
          eigen_include <- system.file("include", package = "RcppEigen")
          stopifnot(nzchar(eigen_include))
          old_flags <- Sys.getenv("PKG_CPPFLAGS", unset = "")
          on.exit(Sys.setenv(PKG_CPPFLAGS = old_flags), add = TRUE)
          Sys.setenv(
            PKG_CPPFLAGS = paste(
              old_flags,
              paste0("-I", shQuote(eigen_include)),
              "-DEIGEN_DONT_PARALLELIZE"
            )
          )
          Rcpp::sourceCpp("src/condition_product.cpp")
          source("R/condition_grn_crossfit.R")
          source("R/condition_grn_fit.R")
          .condition_product_matrix_cpp <- condition_product_matrix_cpp
          .condition_model_name <- function(x) x
          test_file("tests/testthat/test-condition-product-fixed.R")
          test_file("tests/testthat/test-condition-product-random.R")
          test_file("tests/testthat/test-condition-product-output.R")

  installed-r45-matrix17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::remotes
          needs: check
      - name: Pin Matrix 1.7-4
        shell: Rscript {0}
        run: |
          remotes::install_version(
            "Matrix", version = "1.7-4",
            repos = "https://cloud.r-project.org",
            upgrade = "never"
          )
          stopifnot(as.character(packageVersion("Matrix")) == "1.7.4")
      - name: Install Pando and load registered DLL
        run: R CMD INSTALL . --no-multiarch --with-keep.source
      - name: Verify installed namespace and strict native sparse ABI
        shell: Rscript {0}
        run: |
          library(Pando)
          library(testthat)
          stopifnot(as.character(packageVersion("Pando")) == "1.5.1")
          stopifnot(as.character(packageVersion("Matrix")) == "1.7.4")
          stopifnot(is.loaded(
            "_Pando_condition_product_matrix_cpp", PACKAGE = "Pando"
          ))
          stopifnot(is.loaded(
            "_Pando_condition_fit_multitask_path_cpp", PACKAGE = "Pando"
          ))
          test_file(
            "tests/testthat/test-condition-sparse-runtime-regression.R"
          )
          sessionInfo()
""")

          temporary = Path(".github/workflows/apply-cpp-only-runtime-contract.yaml")
          if temporary.exists():
              temporary.unlink()
      - name: Commit canonical C++-only runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Enforce C++-only condition runtime" || exit 0
          git push origin HEAD:agent/fix-sparse-solver-step

