name: native-product-equivalence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install package dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "testthat"))
          remotes::install_deps(dependencies = TRUE)
      - name: Install Pando
        shell: Rscript {0}
        run: remotes::install_local(".", upgrade = "never")
      - name: Run exact product checks
        shell: Rscript {0}
        run: |
          library(testthat)
          library(Pando)
          test_file("tests/testthat/test-condition-product-fixed.R")
          test_file("tests/testthat/test-condition-product-random.R")
          test_file("tests/testthat/test-condition-product-output.R")
