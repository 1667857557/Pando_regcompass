name: native-condition-runtime

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-cpp-only-source:
    if: github.event.pull_request.head.ref == 'agent/fix-sparse-solver-step'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sparse-solver-step
          fetch-depth: 0
      - name: Rewrite canonical solver dispatch
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re
          path = Path("R/condition_grn_solver.R")
          text = path.read_text()
          pattern = re.compile(r"\.condition_fit_multitask_path_core <- function\(.*?\n\}\n\n(?=\.condition_fit_multitask_path <- function)", re.S)
          replacement = base64.b64decode("").decode()
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Failed to replace canonical solver dispatch")
          path.write_text(text)
      - name: Commit strict C++ solver dispatch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add R/condition_grn_solver.R
          git diff --cached --check
          git commit -m "Enforce C++-only solver dispatch" || exit 0
          git push origin HEAD:agent/fix-sparse-solver-step
