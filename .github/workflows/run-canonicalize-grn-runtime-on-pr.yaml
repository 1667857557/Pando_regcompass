name: Run canonical GRN migration

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Execute migration payload
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/canonicalize-grn-runtime-once.yaml')
          lines = path.read_text().splitlines()
          name_i = next(i for i, x in enumerate(lines)
                        if x.strip() == '- name: Canonicalize runtime methods')
          run_i = next(i for i in range(name_i + 1, len(lines))
                       if lines[i].strip() == 'run: |')
          end_i = next(i for i in range(run_i + 1, len(lines))
                       if lines[i].startswith('      - name:'))
          payload = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[run_i + 1:end_i]
          )
          exec(compile(payload, str(path), 'exec'))
      - name: Parse modified R sources
        shell: Rscript {0}
        run: |
          files <- list.files('R', pattern = '[.]R$', full.names = TRUE)
          for (file in files) parse(file = file)
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A R
          git commit -m 'Canonicalize GRN runtime methods'
          git push origin HEAD:${{ github.head_ref }}
