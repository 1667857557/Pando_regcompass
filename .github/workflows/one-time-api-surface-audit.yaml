name: One-time API surface audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Scan functions, tutorials, tests and workflows
        run: python .github/scripts/audit_api_surface.py
      - uses: actions/upload-artifact@v4
        with:
          name: pando-api-surface-audit
          path: |
            api-surface-audit.json
            api-surface-audit.txt
