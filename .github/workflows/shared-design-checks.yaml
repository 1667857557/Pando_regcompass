name: Condition sub-GRN contract checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Parse package sources and tests
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          invisible(lapply(files, parse))

      - name: Verify the canonical within-cell-type condition sub-GRN contract
        shell: Rscript {0}
        run: |
          source("R/condition_grn_solver.R", local = globalenv())
          source("R/condition_grn_refit.R", local = globalenv())
          source("R/condition_grn_output.R", local = globalenv())
          source("R/condition_grn_projection.R", local = globalenv())
          source("R/zzz_fit_schema_contract.R", local = globalenv())

          edge <- data.frame(
            edge_id = c("e1", "e2", "e3"),
            tf = c("TF1", "TF2", "TF3"),
            target = c("G1", "G2", "G3"),
            region = c("P1", "P2", "P3"),
            term = c("P1:TF1", "P2:TF2", "P3:TF3"),
            stringsAsFactors = FALSE
          )
          beta <- matrix(
            c(1, 0, 0, 2, 0.5, -0.5),
            nrow = 3L,
            byrow = TRUE,
            dimnames = list(edge$edge_id, c("Control", "Drug"))
          )
          fit <- structure(
            list(
              schema_version = "pando_condition_grn_fit",
              cell_type = "T_cell",
              fit_engine = "condition_sparse_within_cell_type_oof_refit",
              coefficient_scale = "pooled_cell_type_standardized_refit",
              condition_levels = c("Control", "Drug"),
              edge_table = edge,
              beta_condition_std = beta,
              beta_condition_raw = beta * 1e-12,
              estimability_mask = matrix(
                TRUE, 3L, 2L, dimnames = dimnames(beta)
              ),
              active_mask = abs(beta) > 1e-8,
              predictive_oof_available = c(G1 = TRUE, G2 = TRUE, G3 = TRUE),
              oof_validation_level = c(
                G1 = "within_cell_type_condition_stratified_cells",
                G2 = "within_cell_type_condition_stratified_cells",
                G3 = "within_cell_type_condition_stratified_cells"
              ),
              active_tol = 1e-8
            ),
            class = c("ConditionGRNFit", "list")
          )
          .condition_require_fit(fit)
          control <- condition_grn_subgraph(fit, "Control", scale = "raw")
          drug <- condition_grn_subgraph(fit, "Drug", scale = "raw")
          stopifnot(
            identical(sort(control$nodes$tf), c("TF1", "TF3")),
            identical(sort(drug$nodes$tf), c("TF2", "TF3")),
            sign(beta["e3", "Control"]) != sign(beta["e3", "Drug"]),
            !exists(".condition_require_v5", inherits = FALSE),
            !exists("condition_grn_contrast", inherits = FALSE)
          )

          for (legacy_schema in c(
            "pando_condition_grn_fit_v4",
            "pando_condition_grn_fit_v5"
          )) {
            legacy_fit <- fit
            legacy_fit$schema_version <- legacy_schema
            rejected <- inherits(
              try(.condition_require_fit(legacy_fit), silent = TRUE),
              "try-error"
            )
            stopifnot(rejected)
          }

          raw_predictor <- c(2, 5, 8)
          beta_std <- 0.75
          response_scale <- 4
          standardized <- .condition_projection_predictor(
            raw_predictor, center = 2, predictor_scale = 3, scale = "std"
          ) * beta_std
          raw <- .condition_projection_predictor(
            raw_predictor, center = 2, predictor_scale = 3, scale = "raw"
          ) * (beta_std * response_scale / 3)
          stopifnot(isTRUE(all.equal(raw, standardized * response_scale)))

          coefs <- .condition_format_coefs(
            edge, estimate = beta[, "Control"], corr = rep(0, nrow(edge))
          )
          stopifnot(identical(
            colnames(coefs),
            c("tf", "target", "region", "term", "estimate", "corr")
          ))

          namespace <- readLines("NAMESPACE", warn = FALSE)
          stopifnot(
            any(namespace == "export(infer_grn)"),
            any(namespace == "export(infer_condition_grn)"),
            any(namespace == "export(condition_grn_fit)"),
            any(namespace == "export(project_condition_grn_cells)"),
            !any(grepl("condition_grn_fit_v[0-9]+", namespace)),
            !any(namespace == "export(condition_grn_contrast)"),
            !any(grepl("prepare_grn_design|validate_grn_design", namespace))
          )

          removed <- c(
            "R/grn_design.R",
            "R/grn_design_alignment.R",
            "R/grn_design_contract.R",
            "R/grn_design_mapping_contract.R",
            "R/zzz_condition_grn_comparability.R",
            "R/zzz_condition_grn_condition_sparse.R"
          )
          stopifnot(!any(file.exists(removed)))

          description <- read.dcf("DESCRIPTION")
          stopifnot(
            identical(unname(description[1, "Version"]), "1.6.0"),
            identical(
              unname(description[1, "Config/Pando/NativeSparseABI"]), "4"
            ),
            identical(
              unname(description[1, "Config/Pando/ConditionRefitBackend"]),
              "cpp-eigen-direct-path-fail-fast"
            ),
            identical(
              unname(description[1, "Config/Pando/ConditionTargetEngineBackend"]),
              "cpp-eigen-fused-nested-cv-path-refit-validation-fail-fast"
            )
          )
