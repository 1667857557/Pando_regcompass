name: Shared GRN design checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Parse package sources and tests
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          invisible(lapply(files, parse))

      - name: Verify shared design schema without package dependencies
        shell: Rscript {0}
        run: |
          source("R/grn_design.R", local = globalenv())
          design <- structure(list(
            schema_version = "pando_grn_design_v1",
            candidate_edges = data.frame(
              edge_id = "TF1::chr1-1-10::GENE1",
              tf = "TF1",
              region = "chr1-1-10",
              target = "GENE1",
              atac_feature_id = "chr1-1-10",
              tf_feature_id = "TF1",
              target_feature_id = "GENE1",
              stringsAsFactors = FALSE
            ),
            feature_contract = list(
              cell_ids = c("c1", "c2"),
              rna_feature_ids = c("TF1", "GENE1"),
              atac_feature_ids = "chr1-1-10",
              rna_assay = "RNA",
              atac_assay = "ATAC"
            )
          ), class = c("PandoGRNDesign", "list"))
          stopifnot(isTRUE(validate_grn_design(design)))

          namespace <- readLines("NAMESPACE", warn = FALSE)
          stopifnot(any(namespace == "export(prepare_grn_design)"))
          stopifnot(any(namespace == "export(validate_grn_design)"))
          stopifnot(any(namespace == "S3method(prepare_grn_design,GRNData)"))

          description <- read.dcf("DESCRIPTION")
          stopifnot(identical(unname(description[1, "Version"]), "1.1.2"))
