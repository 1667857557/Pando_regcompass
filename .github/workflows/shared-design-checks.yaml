name: Shared GRN design checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Parse package sources and tests
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          invisible(lapply(files, parse))

      - name: Verify shared design v2 schema without package dependencies
        shell: Rscript {0}
        run: |
          source("R/grn_design.R", local = globalenv())
          source("R/grn_design_alignment.R", local = globalenv())
          source("R/grn_design_contract.R", local = globalenv())
          source("R/grn_design_mapping_contract.R", local = globalenv())

          peaks2gene <- Matrix::Matrix(
            matrix(c(1, 0, 0, 1), nrow = 2,
                   dimnames = list(c("G1", "G2"), c("r2", "r1"))),
            sparse = TRUE
          )
          peaks2motif <- Matrix::Matrix(
            matrix(c(1, 0, 0, 1), nrow = 2,
                   dimnames = list(c("r1", "r2"), c("m2", "m1"))),
            sparse = TRUE
          )
          peak_data <- Matrix::Matrix(
            matrix(seq_len(6), nrow = 3,
                   dimnames = list(paste0("c", 1:3), c("r1", "r2"))),
            sparse = TRUE
          )
          motif2tf <- Matrix::Matrix(
            matrix(c(1, 0, 0, 1), nrow = 2,
                   dimnames = list(c("m1", "m2"), c("TF1", "TF2"))),
            sparse = TRUE
          )
          aligned <- .pando_align_design_matrices(
            peaks2gene, peaks2motif, peak_data, motif2tf
          )
          stopifnot(identical(colnames(aligned$peaks2gene), c("r2", "r1")))
          stopifnot(identical(rownames(aligned$peaks2motif), c("r2", "r1")))
          stopifnot(identical(colnames(aligned$peak_data), c("r2", "r1")))
          stopifnot(identical(colnames(aligned$peaks2motif), c("m2", "m1")))
          stopifnot(identical(rownames(aligned$motif2tf), c("m2", "m1")))

          edges <- data.frame(
            edge_id = "TF1::peak1::GENE1",
            candidate_index = 1L,
            tf = "TF1",
            region = "chr1-1-10",
            target = "GENE1",
            atac_feature_id = "peak1",
            tf_feature_id = "TF1",
            target_feature_id = "GENE1",
            motif_supported = TRUE,
            peak_to_gene_supported = TRUE,
            supporting_regions = "chr1-1-10;chr1-2-9",
            n_supporting_regions = 2L,
            tf_detection = 0.5,
            peak_detection = 0.5,
            target_detection = 0.5,
            stringsAsFactors = FALSE
          )
          design <- structure(list(
            schema_version = "pando_grn_design_v1",
            candidate_edges = edges,
            region_map = data.frame(
              region = c("chr1-1-10", "chr1-2-9"),
              atac_feature_id = c("peak1", "peak1"),
              stringsAsFactors = FALSE
            ),
            target_diagnostics = data.frame(
              target = "GENE1",
              target_detection = 0.5,
              n_candidate_edges = 1L,
              n_candidate_tfs = 1L,
              n_candidate_regions = 1L,
              stringsAsFactors = FALSE
            ),
            feature_contract = list(
              cell_ids = c("c1", "c2"),
              rna_feature_ids = c("TF1", "GENE1"),
              atac_feature_ids = "peak1",
              rna_assay = "RNA",
              atac_assay = "ATAC",
              rna_layer = "data",
              atac_layer = "data"
            ),
            params = list(
              candidate_policy = "structural_shared_before_model_fitting"
            ),
            design_fingerprint = "legacy"
          ), class = c("PandoGRNDesign", "list"))
          design <- .pando_refresh_grn_design_contract(design)
          stopifnot(identical(design$schema_version, "pando_grn_design_v2"))
          stopifnot(grepl("^md5:", design$design_fingerprint))
          stopifnot(identical(
            design$target_diagnostics$n_candidate_regions, 2L
          ))
          stopifnot(identical(
            design$target_diagnostics$n_candidate_atac_features, 1L
          ))
          stopifnot(isTRUE(validate_grn_design(design)))

          broken <- design
          broken$region_map$atac_feature_id[[2L]] <- "other_peak"
          broken$feature_contract$atac_feature_ids <- c("peak1", "other_peak")
          broken$design_fingerprint <- paste0(
            "md5:", .pando_design_md5(.pando_design_payload(broken))
          )
          failure <- tryCatch({
            validate_grn_design(broken)
            NULL
          }, error = function(error) error)
          stopifnot(inherits(failure, "error"))
          stopifnot(grepl(
            "Every supporting regulatory region",
            conditionMessage(failure), fixed = TRUE
          ))

          namespace <- readLines("NAMESPACE", warn = FALSE)
          stopifnot(any(namespace == "export(prepare_grn_design)"))
          stopifnot(any(namespace == "export(validate_grn_design)"))
          stopifnot(any(namespace == "S3method(prepare_grn_design,GRNData)"))

          description <- read.dcf("DESCRIPTION")
          stopifnot(identical(unname(description[1, "Version"]), "1.1.3"))
