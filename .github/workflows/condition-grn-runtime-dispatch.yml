name: condition-grn-runtime-dispatch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install numerical dependency
        shell: Rscript {0}
        run: install.packages("Matrix")

      - name: Exercise package-order condition-GRN dispatch
        shell: Rscript {0}
        run: |
          library(Matrix)
          source("R/condition_grn_crossfit.R")
          source("R/condition_grn_output.R")
          source("R/condition_grn_refit.R")
          source("R/condition_grn_solver.R")
          source("R/condition_grn_structural_zero.R")

          stopifnot(all(
            c("backend", "verified_estimability_mask") %in%
              names(formals(.condition_fit_multitask_path))
          ))
          stopifnot(all(
            c("cache", "estimability_verified", "solver") %in%
              names(formals(.condition_refit_shared_baseline))
          ))

          zero <- Matrix(matrix(0, 12, 1), sparse = TRUE)
          signal_a <- Matrix(matrix(seq_len(12), 12, 1), sparse = TRUE)
          signal_b <- Matrix(matrix(rev(seq_len(12)), 12, 1), sparse = TRUE)
          X <- list(A = cbind(zero, signal_a), B = cbind(zero, signal_b))
          colnames(X$A) <- colnames(X$B) <- c("zero", "signal")
          y <- list(A = seq_len(12), B = rev(seq_len(12)))
          mask <- matrix(
            TRUE, 2, 2,
            dimnames = list(c("zero", "signal"), c("A", "B"))
          )
          center <- as.numeric(Matrix::colMeans(X$A))
          stopifnot(.condition_population_variance(X$A, center)[[1L]] == 0)
          stopifnot(
            .condition_population_variance(X$A)[[1L]] > .Machine$double.eps
          )
          statistics <- .condition_build_fold_statistics(X, y, mask)
          stopifnot(
            !any(statistics$estimability_mask["zero", ]),
            all(statistics$estimability_mask["signal", ])
          )

          set.seed(31)
          X_fit <- list(
            A = Matrix(matrix(rnorm(120), 30, 4), sparse = TRUE),
            B = Matrix(matrix(rnorm(120), 30, 4), sparse = TRUE)
          )
          colnames(X_fit$A) <- colnames(X_fit$B) <- paste0("e", 1:4)
          y_fit <- list(A = rnorm(30), B = rnorm(30))
          fit_mask <- matrix(
            TRUE, 4, 2,
            dimnames = list(colnames(X_fit$A), c("A", "B"))
          )
          verified <- .condition_true_variance_mask(X_fit, fit_mask)
          path <- .condition_fit_multitask_path(
            X_fit,
            y_fit,
            lambda = c(0.2, 0.08),
            coefficient_mask = fit_mask,
            verified_estimability_mask = verified,
            backend = "R",
            max_iter = 2000L
          )
          stopifnot(identical(path$fits[[1L]]$backend, "R_reference_fista"))
          cache <- .condition_make_refit_cache(X_fit, y_fit, "equal")
          refit <- .condition_refit_shared_baseline(
            X_fit,
            y_fit,
            beta_selection = path$fits[[2L]]$beta,
            estimability_mask = verified,
            ridge = 0.01,
            condition_weight = "equal",
            cache = cache,
            estimability_verified = TRUE,
            solver = "direct"
          )
          stopifnot(identical(
            refit$common_metric,
            "pooled_weighted_predictor_gram_direct_schur"
          ))
