name: One-time finalize direct common-dictionary contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pando-direct-common-dictionary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Apply direct source integration
        run: python .github/scripts/finalize_common_dictionary_contract.py
      - name: Parse R and test sources
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) {
            tryCatch(
              parse(file = file),
              error = function(e) stop(file, ": ", conditionMessage(e))
            )
          }
      - name: Verify function and file architecture
        shell: python
        run: |
          from pathlib import Path
          import re
          files = sorted(Path("R").glob("*.R"))
          forbidden = {
              "zz_common_dictionary_validation.R",
              "zz_common_dictionary_projection.R",
              "zzz_fit_schema_contract.R",
          }
          present = forbidden.intersection(path.name for path in files)
          if present:
              raise RuntimeError(f"late-loaded files remain: {present}")
          pattern = re.compile(
              r"(?m)^([A-Za-z.][A-Za-z0-9._]*)\s*<-\s*function\b"
          )
          definitions = {}
          for path in files:
              for name in pattern.findall(path.read_text()):
                  definitions.setdefault(name, []).append(str(path))
          duplicate = {
              name: paths for name, paths in definitions.items()
              if len(paths) > 1
          }
          if duplicate:
              raise RuntimeError(f"duplicate functions: {duplicate}")
          source = "\n".join(path.read_text() for path in files)
          required = [
              "preprocessing_fingerprint",
              "peak_value_type",
              "Probability-valued ATAC layers",
              "RNA/ATAC preprocessing identity changed",
              ".find_modules_network_core",
          ]
          missing = [value for value in required if value not in source]
          if missing:
              raise RuntimeError(f"incomplete direct contract: {missing}")
      - name: Remove temporary migration files
        run: |
          rm .github/scripts/finalize_common_dictionary_contract.py
          rm .github/workflows/one-time-finalize-common-dictionary.yaml
          rmdir .github/scripts 2>/dev/null || true
      - name: Commit canonical source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "integrate common-dictionary contract directly"
          git push origin HEAD:${{ github.head_ref }}
