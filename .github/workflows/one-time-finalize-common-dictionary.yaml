name: One-time finalize current common-dictionary API

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pando-direct-common-dictionary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Apply candidate preprocessing provenance
        run: python .github/scripts/finalize_candidate_provenance.py
      - name: Remove obsolete API and tutorial surfaces
        run: python .github/scripts/finalize_current_api.py
      - name: Parse R and test sources
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) {
            tryCatch(
              parse(file = file),
              error = function(e) stop(file, ": ", conditionMessage(e))
            )
          }
      - name: Verify current source and API contract
        shell: python
        run: |
          from pathlib import Path
          import re
          files = sorted(Path("R").glob("*.R"))
          forbidden_files = {
              "zz_common_dictionary_validation.R",
              "zz_common_dictionary_projection.R",
              "zzz_fit_schema_contract.R",
          }
          present = forbidden_files.intersection(path.name for path in files)
          if present:
              raise RuntimeError(f"late-loaded files remain: {present}")
          pattern = re.compile(
              r"(?m)^([A-Za-z.][A-Za-z0-9._]*)\s*<-\s*function\b"
          )
          definitions = {}
          for path in files:
              for name in pattern.findall(path.read_text()):
                  definitions.setdefault(name, []).append(str(path))
          duplicate = {
              name: paths for name, paths in definitions.items()
              if len(paths) > 1
          }
          if duplicate:
              raise RuntimeError(f"duplicate functions: {duplicate}")
          source = "\n".join(path.read_text() for path in files)
          required = [
              "pando_candidate_input_provenance_v1",
              "preprocessing_provenance_verified",
              "different RNA/ATAC ",
              "layers, value semantics, or preprocessing fingerprints.",
              "frozen dictionary and fixed fit use different RNA/ATAC ",
              "RNA/ATAC preprocessing identity changed",
          ]
          missing = [value for value in required if value not in source]
          if missing:
              raise RuntimeError(f"incomplete reference contract: {missing}")
          retired = [
              "condition_grn_contrast <- function",
              "project_condition_grn_primary_cells <- function",
              "project_condition_grn_to_cells <- function",
              "network_name = NULL, cell_type = NULL",
          ]
          found = [value for value in retired if value in source]
          if found:
              raise RuntimeError(f"retired API remains: {found}")
          if Path("docs/condition-subgrn-shared-baseline.md").exists():
              raise RuntimeError("obsolete shared-baseline tutorial remains")
      - name: Commit canonical source and documentation changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A R tests/testthat NEWS.md man vignettes docs
          git commit -m "finalize current common-dictionary API"
          git push origin HEAD:${{ github.head_ref }}
