name: condition-grn-core-check

on:
  push:
    branches:
      - main
      - agent/shared-design-independent-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install numerical dependency
        shell: Rscript {0}
        run: install.packages('Matrix')
      - name: Parse package R sources
        shell: Rscript {0}
        run: |
          files <- list.files('R', pattern = '\\.R$', full.names = TRUE)
          invisible(lapply(files, parse))
          stopifnot(length(list.files(
            'R', pattern = '^zzz.*condition_grn.*\\.R$'
          )) == 0L)
      - name: Run condition-aware numerical smoke tests
        shell: Rscript {0}
        run: |
          library(Matrix)
          source('R/condition_grn_solver.R')
          source('R/condition_grn_crossfit.R')
          source('R/condition_grn_refit.R')

          prox_input <- matrix(c(3, 3, 0.2, 0.2), nrow = 2, byrow = TRUE)
          group_only <- .condition_sparse_group_prox(
            prox_input, step = 1, lambda = 1, alpha = 1, condition_mix = 0
          )
          stopifnot(all(group_only[2, ] == 0))

          set.seed(11)
          x_control <- Matrix(matrix(rnorm(80), ncol = 1), sparse = TRUE)
          x_drug <- Matrix(matrix(rnorm(80), ncol = 1), sparse = TRUE)
          y_control <- 2 * as.numeric(x_control[, 1]) + rnorm(80, sd = 0.05)
          y_drug <- -2 * as.numeric(x_drug[, 1]) + rnorm(80, sd = 0.05)
          fit <- .condition_fit_multitask_lambda(
            X_list = list(Control = x_control, Drug = x_drug),
            y_list = list(Control = y_control, Drug = y_drug),
            lambda = 1e-4,
            alpha = 0.5,
            condition_mix = 0.5,
            max_iter = 2000,
            tol_objective = 1e-9,
            tol_coef = 1e-8,
            keep_history = TRUE
          )
          stopifnot(fit$beta[1, 1] > 0, fit$beta[1, 2] < 0)
          stopifnot(all(diff(fit$history) <= 1e-8))

          set.seed(12)
          X <- list(
            Control = Matrix(matrix(rnorm(160), ncol = 4), sparse = TRUE),
            Drug = Matrix(matrix(rnorm(160), ncol = 4), sparse = TRUE)
          )
          colnames(X$Control) <- colnames(X$Drug) <- paste0('e', 1:4)
          y <- list(Control = rnorm(40), Drug = rnorm(40))
          independent <- .condition_fit_multitask_lambda(
            X, y, lambda = 0.05, alpha = 0.5, condition_mix = 1,
            condition_weight = 'equal', max_iter = 5000,
            tol_objective = 1e-10, tol_coef = 1e-9
          )
          changed_y <- y
          changed_y$Drug <- changed_y$Drug + 10 * as.numeric(X$Drug[, 1])
          independent_changed <- .condition_fit_multitask_lambda(
            X, changed_y, lambda = 0.05, alpha = 0.5, condition_mix = 1,
            condition_weight = 'equal', max_iter = 5000,
            tol_objective = 1e-10, tol_coef = 1e-9
          )
          stopifnot(isTRUE(all.equal(
            independent$beta[, 1], independent_changed$beta[, 1],
            tolerance = 1e-7
          )))
          stopifnot(!isTRUE(all.equal(
            independent$beta[, 2], independent_changed$beta[, 2],
            tolerance = 1e-3
          )))

          set.seed(13)
          refit_X <- list(
            Control = matrix(rnorm(180), nrow = 45, ncol = 4),
            Drug = matrix(rnorm(180), nrow = 45, ncol = 4)
          )
          colnames(refit_X$Control) <- colnames(refit_X$Drug) <- paste0('e', 1:4)
          refit_y <- list(
            Control = 0.8 * refit_X$Control[, 1] -
              0.3 * refit_X$Control[, 3] + rnorm(45, sd = 0.1),
            Drug = -0.4 * refit_X$Drug[, 1] +
              0.5 * refit_X$Drug[, 2] + rnorm(45, sd = 0.1)
          )
          selection <- matrix(
            c(0.8, -0.4, 0, 0.5, -0.3, 0, 0, 0),
            nrow = 4,
            dimnames = list(paste0('e', 1:4), c('Control', 'Drug'))
          )
          mask <- matrix(TRUE, 4, 2, dimnames = dimnames(selection))
          fold_stats <- .condition_build_fold_statistics(
            refit_X, refit_y, mask
          )
          cached_transform <- .condition_build_balanced_transform(
            refit_X, refit_y, fold_statistics = fold_stats
          )
          plain_transform <- .condition_build_balanced_transform(
            refit_X, refit_y
          )
          stopifnot(identical(
            cached_transform$predictor_center,
            plain_transform$predictor_center
          ))
          stopifnot(identical(
            cached_transform$predictor_scale,
            plain_transform$predictor_scale
          ))
          cache <- .condition_make_refit_cache(refit_X, refit_y, 'equal')
          reference <- .condition_refit_shared_baseline_reference(
            refit_X, refit_y, selection, mask,
            ridge = 0.05, active_tol = 1e-8,
            condition_weight = 'equal', cache = cache,
            estimability_verified = TRUE
          )
          direct <- .condition_refit_shared_baseline(
            refit_X, refit_y, selection, mask,
            ridge = 0.05, active_tol = 1e-8,
            condition_weight = 'equal', cache = cache,
            estimability_verified = TRUE, solver = 'direct'
          )
          stopifnot(isTRUE(all.equal(
            direct$beta, reference$beta, tolerance = 1e-6
          )))
          stopifnot(isTRUE(all.equal(
            direct$beta_shared, reference$beta_shared, tolerance = 1e-6
          )))
          stopifnot(identical(direct$support_mask, reference$support_mask))

          X_zero <- list(
            A = Matrix(matrix(rnorm(80), ncol = 2), sparse = TRUE),
            B = Matrix(matrix(rnorm(80), ncol = 2), sparse = TRUE)
          )
          y_zero <- list(A = rnorm(40), B = rnorm(40))
          zero_fit <- .condition_fit_multitask_lambda(
            X_list = X_zero,
            y_list = y_zero,
            lambda = 1e6,
            alpha = 1,
            condition_mix = 0.5,
            max_iter = 100
          )
          stopifnot(all(zero_fit$beta == 0))
