name: Pando source check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Validate source architecture
        shell: python
        run: |
          from pathlib import Path
          import re
          files = sorted(Path("R").glob("*.R"))
          direct_condition_fit = []
          pattern = re.compile(r"(?m)^condition_grn_fit[.]GRNData\s*<-\s*function\b")
          for path in files:
              if pattern.search(path.read_text()):
                  direct_condition_fit.append(str(path))
          if direct_condition_fit != ["R/condition_grn.R"]:
              raise RuntimeError(
                  "condition_grn_fit.GRNData must have one canonical direct definition: "
                  f"{direct_condition_fit}"
              )
          completion = Path("R/zzzzz_condition_fit_contract.R").read_text()
          forbidden = [
              "infer_condition_grn.GRNData <- function",
              "condition_grn_fit.GRNData <- function",
          ]
          present = [value for value in forbidden if value in completion]
          if present:
              raise RuntimeError(f"late contract layer redefines canonical methods: {present}")
          required_completion = [
              ".pando_condition_grn_fit_complete_contract_method",
              "registerS3method",
              ".pando_condition_grn_fit_base_impl",
          ]
          missing = [value for value in required_completion if value not in completion]
          if missing:
              raise RuntimeError(f"condition-fit S3 completion is incomplete: {missing}")
          projection = Path("R/condition_grn_projection.R").read_text()
          required = [
              ".condition_resolve_projection_targets",
              ".condition_validate_projection_cells",
              "fitted paired cell(s)",
          ]
          missing = [value for value in required if value not in projection]
          if missing:
              raise RuntimeError(f"projection contract is incomplete: {missing}")
      - name: Parse package sources
        shell: Rscript {0}
        run: |
          stopifnot(nrow(read.dcf("DESCRIPTION")) == 1L)
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) parse(file = file)
      - name: Run lightweight contract tests
        shell: Rscript {0}
        run: |
          source("R/condition_grn_projection.R")
          source("R/zzzzz_condition_fit_contract.R")
          stopifnot(identical(
            .condition_resolve_projection_targets(
              c("tp53", "slc22a17"), c("TP53", "Slc22a17")
            ),
            c("TP53", "Slc22a17")
          ))
          ambiguous <- try(
            .condition_resolve_projection_targets("gene", c("GENE", "gene")),
            silent = TRUE
          )
          stopifnot(inherits(ambiguous, "try-error"))
          fit <- list(
            condition_levels = c("A", "B"),
            condition_cell_ids = list(A = "cell1", B = "cell2")
          )
          cells <- .condition_validate_projection_cells(
            fit, c("cell1", "cell2")
          )
          stopifnot(identical(cells$cells, c("cell1", "cell2")))
          dictionary <- data.frame(edge_id = "G||TF||chr1:1-2")
          attr(dictionary, "preprocessing_provenance_verified") <- TRUE
          contract <- structure(
            list(edge_dictionary = dictionary),
            class = c("ConditionGRNFit", "list")
          )
          stopifnot(isTRUE(
            .pando_complete_condition_fit_contract(contract)$dictionary_preprocessing_provenance_verified
          ))
          .pando_condition_grn_fit_base_impl <- function(
              object, cell_type = NULL, ...) {
            contract
          }
          wrapped <- .pando_condition_grn_fit_complete_contract_method(NULL)
          stopifnot(isTRUE(
            wrapped$dictionary_preprocessing_provenance_verified
          ))
      - name: Build source package
        run: R CMD build --no-build-vignettes --no-manual .
