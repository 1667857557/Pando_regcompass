name: Pando source check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Validate conditional GRN source architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          files = sorted(Path("R").glob("*.R"))
          source = {str(path): path.read_text() for path in files}
          combined = "\n".join(source.values())

          canonical = {
              "infer_condition_grn.GRNData": "R/condition_grn.R",
              ".condition_ridge_fit": "R/condition_multitask_ridge.R",
              ".condition_scheme_e_fit": "R/condition_sparse_deviation.R",
              ".condition_ridge_target": "R/condition_multitask_ridge_fit.R",
              ".condition_no_fusion_condition_fit":
                  "R/condition_multitask_ridge_fit.R",
              ".condition_exact_edge_inference":
                  "R/condition_multitask_ridge_significance.R",
              ".condition_apply_activity_gate":
                  "R/condition_multitask_ridge_significance.R",
          }
          for name, expected_path in canonical.items():
              pattern = re.compile(rf"(?m)^{re.escape(name)}\s*<-\s*function\b")
              locations = [path for path, text in source.items() if pattern.search(text)]
              if locations != [expected_path]:
                  raise RuntimeError(
                      f"{name} must have one direct definition in {expected_path}; "
                      f"found {locations}"
                  )

          forbidden = [
              ".condition_joint_inference_design <- function",
              ".condition_joint_inference_fit <- function",
              ".condition_joint_contrast <- function",
              ".condition_bh_by_condition_target <- function",
              "scheme_e_fusion_component_joint_refit_v1",
              "condition_union_Estar_z025_jointse",
              "pando_condition_grn_Estar_jointse_v1",
              "fusion-component-joint-refit-condition-target-BH",
              "any-condition-padj-exact-edge-union",
              "condition_target_BH",
              ".condition_scheme_e_group_prox",
              ".condition_ridge_control <- function",
              "zzzzz_condition_fit_contract",
          ]
          present = [value for value in forbidden if value in combined]
          if present:
              raise RuntimeError(f"obsolete conditional inference remains: {present}")

          description = Path("DESCRIPTION").read_text()
          required_description = [
              "Config/Pando/ConditionGRNModelSchema: pando_condition_grn_Estar_z025_inference_separated_v1",
              "Config/Pando/ConditionGRNMethod: global-condition-union-Estar-z025-separated-inference",
              "Config/Pando/ConditionProjectionPolicy: exact-edge-whole-network-BH-common-topology",
              "Config/Pando/ConditionInference: no-fusion-condition-local-lm-edge-omnibus-whole-network-BH",
              "Config/Pando/ConditionR2: full-data-diagnostic-only",
          ]
          missing = [x for x in required_description if x not in description]
          if missing:
              raise RuntimeError(f"condition DESCRIPTION contract missing: {missing}")

          required = {
              "R/condition_sparse_deviation.R": [
                  ".condition_E_star_z <- 0.25",
                  ".condition_q_orthogonal_decomposition <- function",
                  ".condition_profile_coordinate_information <- function",
                  ".condition_E_star_fit <- function",
                  ".condition_scheme_e_fit <- function",
                  "shared_by_boundary",
                  "fused_by_penalty",
              ],
              "R/condition_multitask_ridge_fit.R": [
                  '"condition_union_Estar_z025_inference_separated"',
                  '"frozen_dictionary_condition_local_gaussian_lm_edge_omnibus_v1"',
                  ".condition_no_fusion_condition_fit <- function",
                  "stats::pt(",
                  "condition_pval",
                  "inference_variance",
                  "penalty_effect = estimate",
              ],
              "R/condition_multitask_ridge_significance.R": [
                  ".condition_exact_edge_inference <- function",
                  '"single_condition_exact_t"',
                  '"independent_condition_wald_chisq"',
                  "stats::pchisq(",
                  "stats::p.adjust(",
                  '"exact_edge_whole_cell_type_network_BH"',
                  "edge_supported",
                  "active_in_regcompass",
              ],
              "R/condition_multitask_ridge_runtime.R": [
                  "global_edges <-",
                  "condition_edges <- lapply",
                  "edge_inference = NULL",
                  ".condition_projection_policy",
              ],
              "R/condition_grn_projection.R": [
                  "active_in_regcompass",
                  "penalty_effect",
                  ".condition_projection_policy",
              ],
          }
          for path, needles in required.items():
              text = source[path]
              missing = [x for x in needles if x not in text]
              if missing:
                  raise RuntimeError(f"{path} contract missing: {missing}")

      - name: Parse package sources and tests
        shell: Rscript {0}
        run: |
          stopifnot(nrow(read.dcf("DESCRIPTION")) == 1L)
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) parse(file = file)

      - name: Run lightweight conditional GRN invariants
        shell: Rscript {0}
        run: |
          source("R/condition_multitask_ridge.R")
          source("R/condition_sparse_deviation.R")
          source("R/condition_multitask_ridge_fit.R")
          source("R/condition_multitask_ridge_significance.R")

          control <- .condition_E_star_control(list(
            solver_tol = 1e-12, solver_max_iter = 10000L
          ))
          scalar <- .condition_E_star_fit(
            H = matrix(4, 1, 1), r = 1.2, information = 4,
            control = control
          )
          stopifnot(identical(scalar$status, "ok"))
          stopifnot(abs(scalar$delta[[1]] - 0.175) < 1e-9)
          stopifnot(scalar$kkt_residual < 1e-8)

          q1 <- matrix(c(7, 1.2, 1.2, 3.5), 2, 2)
          q2 <- matrix(c(2.5, -0.4, -0.4, 5), 2, 2)
          q3 <- matrix(c(4.2, 0.7, 0.7, 6.1), 2, 2)
          Q <- .condition_blockdiag(list(q1, q2, q3))
          A <- kronecker(matrix(1, 3, 1), diag(2))
          D <- matrix(0, 4, 6)
          D[1, c(1, 3)] <- c(-1, 1)
          D[2, c(1, 5)] <- c(-1, 1)
          D[3, c(2, 4)] <- c(-1, 1)
          D[4, c(2, 6)] <- c(-1, 1)
          geometry <- .condition_q_orthogonal_decomposition(Q, A, D, 1e-12)
          stopifnot(max(abs(D %*% geometry$R - diag(4))) < 1e-10)
          stopifnot(max(abs(crossprod(A, Q %*% geometry$R))) < 1e-10)

          set.seed(17)
          x <- cbind(e1 = rnorm(80), e2 = rnorm(80))
          x[, 2] <- 0.45 * x[, 1] + rnorm(80, sd = 0.8)
          y <- 1.2 + x %*% c(0.8, -0.35) + rnorm(80, sd = 0.4)
          scaling <- .condition_ridge_scaling(list(A = x, B = x), 1e-8)
          one <- .condition_no_fusion_condition_fit(
            x, as.numeric(y), scaling, rank_tol = 1e-12,
            min_residual_df = 1L
          )
          direct <- summary(lm(as.numeric(y) ~ x))$coefficients
          stopifnot(identical(one$status, "ok"))
          stopifnot(max(abs(one$estimate - direct[-1, 1])) < 1e-8)
          stopifnot(max(abs(one$se - direct[-1, 2])) < 1e-8)
          stopifnot(max(abs(one$pval - direct[-1, 4])) < 1e-8)

          fit <- list(
            edge_dictionary = data.frame(
              edge_id = c("G||TF1||P1", "G||TF2||P2"),
              target = "G", tf = c("TF1", "TF2"),
              region = c("P1", "P2"), atac_feature_id = c("P1", "P2"),
              candidate_index = 1:2, stringsAsFactors = FALSE
            ),
            condition_levels = c("A", "B"), adjust_method = "BH",
            padj_threshold = 0.05
          )
          coef <- data.frame(
            edge_id = rep(fit$edge_dictionary$edge_id, each = 2),
            condition = rep(c("A", "B"), 2), fit_status = "ok",
            penalty_effect = 1,
            inference_estimate = c(0.5, NA, 0.4, 0.35),
            inference_variance = c(0.01, NA, 0.01, 0.01),
            inference_statistic = c(5, NA, 4, 3.5),
            condition_pval = c(1e-4, NA, 2e-4, 5e-4),
            condition_inference_estimable = c(TRUE, FALSE, TRUE, TRUE),
            stringsAsFactors = FALSE
          )
          edge <- .condition_exact_edge_inference(fit, coef)
          stopifnot(edge$edge_inference_test[[1]] == "single_condition_exact_t")
          stopifnot(abs(edge$edge_pval[[1]] - 1e-4) < 1e-15)
          stopifnot(edge$edge_inference_test[[2]] == "independent_condition_wald_chisq")
          stopifnot(identical(edge$bh_scope,
                              rep("exact_edge_whole_cell_type_network_BH", 2)))

      - name: Build source package
        run: R CMD build --no-build-vignettes --no-manual .
