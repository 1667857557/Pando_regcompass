name: Common dictionary condition GRN

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Verify retired condition engine is absent
        shell: bash
        run: |
          test ! -e R/RcppExports.R
          test -z "$(find src -maxdepth 1 -type f 2>/dev/null | head -n 1)"
          ! grep -R -n -E 'outer_nfolds|inner_nfolds|condition_mix|engine_control|projection_condition_full_oof' R DESCRIPTION NAMESPACE
      - name: Check package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(args = c('--no-manual'), error_on = 'error')
