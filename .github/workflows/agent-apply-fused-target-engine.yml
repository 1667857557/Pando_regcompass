name: Apply fused target engine

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cpp-batched-condition-refit
          fetch-depth: 0
      - name: Apply reviewed fused-engine source bundle
        shell: bash
        run: |
          cat > /tmp/pando-changes.tar.gz.b64 <<'BUNDLE'
[... ELLIPSIZATION ...]
BUNDLE
          base64 --decode /tmp/pando-changes.tar.gz.b64 > /tmp/pando-changes.tar.gz
          tar -xzf /tmp/pando-changes.tar.gz -C .
          rm -f .github/workflows/agent-export-source.yml
          rm -f .github/workflows/agent-apply-fused-target-engine.yml
          git diff --check
      - name: Commit fused per-target engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fuse per-target nested CV into C++"
          git push origin HEAD:agent/cpp-batched-condition-refit
